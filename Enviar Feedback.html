      <header class="page-header">

        <img
          src="./assets/imagem logo.png"
          alt="Smart Luny"
          class="logo-topo"
        >

        <div class="cabecalho-texto">

          <h2 id="tituloFeedback">
            Enviar Feedback
          </h2>

          <p id="descricaoFeedback">
            Ajude-nos a melhorar a sua experiência no Smart Luny.
          </p>

        </div>

      </header>

      <section class="card-feedback">

        <p
          id="motivacaoFeedback1"
          class="feedback-intro"
        >
          A sua opinião ajuda-nos a melhorar o Smart Luny.
        </p>

        <label
          for="sugestao"
          id="labelMensagem"
        >
          Escreva o seu feedback
        </label>

        <textarea
          id="sugestao"
          placeholder="Conte-nos a sua experiência, opinião, dificuldade ou ideia..."
        ></textarea>

        <div class="form-acoes">

          <button
            id="btnEnviarFeedback"
            type="button"
            title="Enviar feedback"
            aria-label="Enviar feedback"
          >
            ➤
          </button>

        </div>

      </section>

    </main>
