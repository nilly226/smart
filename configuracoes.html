<!doctype html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="tituloPagina">Configurações - Smart Luny</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/configuracoes.css">
    <link rel="stylesheet" href="css/mobile.css">

    <link rel="icon" href="./assets/imagem logo.png" type="image/png">
</head>

<body>

    <div class="layout">

        <main class="content">

            <header class="page-header">

                <img
                    src="./assets/imagem logo.png"
                    alt="Smart Luny"
                    class="logo-topo"
                >

                <div class="cabecalho-texto">

                    <h2 id="tituloConfiguracoes">
                        Configurações
                    </h2>

                    <p id="descricaoConfiguracoes">
                        Personalize o Smart Luny de acordo com as suas necessidades.
                    </p>

                </div>

            </header>

            <section class="config-list">

                <button
                    type="button"
                    class="config-item"
                    id="perfilNegocioBtn"
                >

                    <div>

                        <h3 id="tituloPerfilNegocio">
                            Perfil do negócio
                        </h3>

                        <p id="descricaoPerfilNegocio">
                            Nome e actividade do seu negócio
                        </p>

                    </div>

                    <span>›</span>

                </button>

                <button
                    type="button"
                    class="config-item"
                    id="idiomaBtn"
                >

                    <div>

                        <h3>
                            Idioma
                        </h3>

                        <p id="idiomaAtual">
                            Português
                        </p>

                    </div>

                    <span>›</span>

                </button>

                <button
                    type="button"
                    class="config-item"
                    id="moedaBtn"
                >

                    <div>

                        <h3>
                            Moeda
                        </h3>

                        <p id="moedaAtual">
                            Metical moçambicano (MZN)
                        </p>

                    </div>

                    <span>›</span>

                </button>

                <div class="config-item stock-item">

                    <div>

                        <h3>
                            Stock
                        </h3>

                        <p id="stockAtual">
                            Ativar gestão de stock
                        </p>

                    </div>

                    <label class="stock-toggle">

                        <input
                            type="checkbox"
                            id="stockToggle"
                        >

                        <span class="stock-slider"></span>

                    </label>

                </div>

                <a
                    href="Enviar Feedback.html"
                    class="config-item feedback-card"
                >

                    <div>

                        <h3 id="tituloFeedback">
                            Enviar Feedback
                        </h3>

                        <p id="descricaoFeedback">
                            Ajude-nos a melhorar a sua experiência no Smart Luny.
                        </p>

                    </div>

                    <span class="config-arrow">
                        ›
                    </span>

                </a>

                <button
                    type="button"
                    class="config-item"
                    id="painelAdminBtn"
                    style="display: none;"
                >

                    <div>

                        <h3 id="tituloPainelAdmin">
                            Painel de Administração
                        </h3>

                        <p id="descricaoPainelAdmin">
                            Acompanhe os dados e a utilização do Smart Luny.
                        </p>

                    </div>

                    <span>›</span>

                </button>

            </section>

            <section class="config-session">

                <button
                    type="button"
                    id="logoutConfig"
                >

                    <span id="textoLogout">
                        Terminar Sessão
                    </span>

                </button>

            </section>

        </main>

    </div>

    <nav class="bottom-nav">

        <a href="inicio.html">

        <a href="transacoes.html">

        </a>

        <a href="itens.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7l8-4 8 4-8 4-8-4z"></path>
                <path d="M4 7v10l8 4 8-4V7"></path>
                <path d="M12 11v10"></path>
            </svg>
            <span id="menuItens">Itens</span>
        </a>

        <a href="historico.html">

                <path d="M3 4v5h5"></path>
                <path d="M12 7v5l3 2"></path>
            </svg>
            <span id="menuHistorico">Histórico</span>
