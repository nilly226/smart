<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="css/login.css"
    />

    <link
      rel="icon"
      href="./assets/imagem logo.png"
      type="image/png"
    />

    <title>Login - Smart Luny</title>
  </head>

  <body>

    <main class="login-container">

      <div class="brand">
        <img
          src="./assets/imagem logo.png"
          alt="Smart Luny"
          class="brand-logo"
        />

        <h1>Smart Luny</h1>
      </div>

      <p class="subtitulo">
        Organize suas finanças de forma simples<br />
        e inteligente
      </p>

      <form
        class="login-form"
        onsubmit="event.preventDefault(); login();"
      >

        <div class="input-group">

          <i
            class="fa-regular fa-envelope"
            aria-hidden="true"
          ></i>

          <label
            class="sr-only"
            for="email"
          >
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
            required
          />

        </div>

        <div class="input-group">

          <i
            class="fa-solid fa-lock"
            aria-hidden="true"
          ></i>

          <label
            class="sr-only"
            for="senha"
          >
            Senha
          </label>

          <input
            type="password"
            id="senha"
            placeholder="Senha"
            autocomplete="current-password"
            required
          />

          <button
            class="toggle-password"
            id="mostrarSenha"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          ></button>

        </div>

        <button
          class="entrar-btn"
          type="submit"
        >

          <i
            class="fa-solid fa-arrow-right"
            aria-hidden="true"
          ></i>

          <span>Entrar</span>

        </button>

      </form>

      <p class="esqueci-senha">
        <a href="recuperar-senha.html">
          Esqueci a senha?
        </a>
      </p>

      <div class="separador">
        <span>ou</span>
      </div>

      <button
        id="google-login"
        class="google-btn"
        type="button"
      >

        <i
          class="fa-brands fa-google"
          aria-hidden="true"
        ></i>

        <span>
          Continuar com Google
        </span>

      </button>

      <p class="criar-conta">

        Não tem conta?

        <a href="registar.html">
          Criar conta
        </a>

      </p>

    </main>

    <script
      type="module"
      src="./js/login.js"
    ></script>

    <script
      type="module"
      src="./js/visitas.js"
    ></script>

  </body>
</html>
