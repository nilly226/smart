<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/registar.css" />
    <link rel="icon" href="./assets/imagem logo.png" type="image/png" />

    <title>Criar Conta - Smart Luny</title>
  </head>

  <body>
    <div class="login-container">
      <h1>Smart Luny</h1>
      <p>Criar nova conta</p>

      <form id="register-form" onsubmit="return criarConta(event)">

        <input
          type="text"
          id="nome"
          placeholder="Nome"
          autocomplete="name"
          required
        />

        <input
          type="email"
          id="email"
          placeholder="Email"
          autocomplete="email"
          required
        />

        <input
          type="tel"
          id="telefone"
          placeholder="Número de telefone (opcional)"
          autocomplete="tel"
        />

        <div class="input-senha" style="position: relative;">
          <input
            type="password"
            id="senha"
            placeholder="Senha"
            autocomplete="new-password"
            required
            style="width: 100%; margin-bottom: 15px;"
          />
          <button
            class="toggle-password"
            id="mostrarSenha"
            type="button"
            aria-label="Mostrar senha"
            style="position: absolute; right: 10px; top: 12px; background: none; border: none; cursor: pointer; width: auto; padding: 0;"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div class="input-senha" style="position: relative;">
          <input
            type="password"
            id="confirmarSenha"
            placeholder="Confirmar senha"
            autocomplete="new-password"
            required
            style="width: 100%; margin-bottom: 15px;"
          />
          <button
            class="toggle-password"
            id="mostrarConfirmarSenha"
            type="button"
            aria-label="Mostrar confirmação de senha"
            style="position: absolute; right: 10px; top: 12px; background: none; border: none; cursor: pointer; width: auto; padding: 0;"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <label class="politica-checkbox">
          <input
            type="checkbox"
            id="aceitarPolitica"
          />

          <span>
            Li, compreendi e aceito a
            <a href="saiba-mais.html#politica-utilizacao" target="_blank">
              Política de Utilização do Smart Luny
            </a>.
          </span>
        </label>

        <button
          id="btn-criar-conta"
          type="submit"
          disabled
        >
          Criar Conta
        </button>

      </form>

      <button
        id="google-login"
        class="google-btn"
        type="button"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>

        <span>Registar com Google</span>
      </button>

      <p>
        Já tens conta?
        <a href="login.html">Entrar</a>
      </p>
    </div>

    <script type="module" src="./js/registar.js"></script>
    <script type="module" src="./js/visitas.js"></script>
  </body>
</html>
