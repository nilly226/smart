<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - Smart Luny</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/mobile.css">
    <style>
        :root {
            --azul: #0d6efd;
            --azul-escuro: #0b5ed7;
            --azul-claro: #e8f0fe;
            --cinza: #f4f7fb;
            --borda: #e3e8f4;
            --texto: #17365d;
            --sombra: 0 7px 22px rgba(33, 87, 132, 0.07);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--cinza);
            color: var(--texto);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid var(--borda);
            z-index: 10;
        }

        .topo-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            color: var(--azul);
            cursor: pointer;
        }

        .topo-logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .topo-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--texto);
            cursor: pointer;
        }

        .topo-info strong { font-weight: 600; }
        .topo-info .funcao-longa { color: var(--azul); }
        .topo-info .funcao-curta { display: none; color: var(--azul); }

        .avatar-eu {
            width: 32px;
            height: 32px;
            background: var(--azul);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .seta-eu { font-size: 10px; color: #888; }

        .abas-suporte {
            display: flex;
            background: #fff;
            border-bottom: 1px solid var(--borda);
            padding: 0 20px;
            gap: 20px;
            z-index: 10;
        }

        .aba-suporte {
            background: none;
            border: none;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #777;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .aba-suporte.ativa {
            color: var(--azul);
            border-bottom-color: var(--azul);
        }

        .conteudo-suporte {
            flex: 1;
            min-height: 0;
            display: flex;
            position: relative;
        }

        .vista-suporte { flex: 1; display: flex; min-height: 0; }
        .vista-suporte.oculta { display: none; }

        .layout-conv {
            flex: 1;
            display: grid;
            grid-template-columns: 340px 1fr;
            min-height: 0;
        }

        .painel-pedidos {
            background: #fff;
            border-right: 1px solid var(--borda);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .filtros-conversas {
            display: flex;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid var(--borda);
        }

        .filtro-btn {
            flex: 1;
            background: var(--cinza);
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
        }

        .filtro-btn.ativo { background: var(--azul-claro); color: var(--azul); }

        .btn-esvaziar {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin: 0 12px 12px;
        }

        .pesquisa-suporte {
            margin: 12px;
            padding: 10px 12px;
            border: 1px solid var(--borda);
            border-radius: 8px;
            background: var(--cinza);
            outline: none;
            font-size: 14px;
        }

        .lista-itens { flex: 1; overflow-y: auto; }

        .item-pedido {
            width: 100%;
            border: none;
            background: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid #f0f4f8;
        }

        .item-pedido:hover, .item-pedido.ativo { background: var(--cinza); }

        .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; font-size: 16px; flex-shrink: 0;
        }

        .av-0 { background: #3b82f6; }
        .av-1 { background: #10b981; }
        .av-2 { background: #f59e0b; }
        .av-3 { background: #8b5cf6; }
        .av-4 { background: #ef4444; }

        .item-corpo { flex: 1; min-width: 0; }
        .item-linha { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }

        .item-nome {
            font-weight: 600; font-size: 15px; color: var(--texto);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .tag-estado { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .tag-estado.aberta { background: #fef3c7; color: #d97706; }
        .tag-estado.em_atendimento { background: #dbeafe; color: #2563eb; }
        .tag-estado.fechada { background: #dcfce7; color: #16a34a; }

        .item-assunto {
            display: block; font-size: 13px; color: #666;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
        }

        .item-meta { display: block; font-size: 12px; color: #999; }

        .painel-conversa { display: flex; flex-direction: column; background: var(--cinza); min-height: 0; }

        .cabecalho-conversa {
            display: flex; align-items: center; padding: 10px 16px;
            background: #fff; border-bottom: 1px solid var(--borda); gap: 12px;
        }

        .info-conversa { flex: 1; min-width: 0; }
        .info-conversa strong { display: block; font-size: 16px; color: var(--texto); }

        .sub-conversa { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }

        .ponto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .ponto.aberta { background: #f59e0b; }
        .ponto.em_atendimento { background: #3b82f6; }
        .ponto.fechada { background: #10b981; }
        .ponto.off { background: #ccc; }

        .identidade-cliente { display: block; font-size: 12px; color: #999; margin-top: 2px; }
        .acoes-conversa { display: flex; gap: 8px; }

        .btn-suporte {
            background: var(--azul); color: #fff; border: none;
            padding: 8px 16px; border-radius: 6px; font-size: 13px;
            font-weight: 600; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 6px;
        }

        .btn-secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }
        .btn-pequeno { padding: 6px 12px; font-size: 12px; }
        .btn-perigo { background: #fee2e2; color: #dc2626; border: none; }

        .msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .msg-chat {
            max-width: 75%; padding: 10px 14px; border-radius: 12px;
            display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .msg-chat.eu { align-self: flex-end; background: #dbeafe; border-bottom-right-radius: 4px; }
        .msg-chat.outro { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; }
        .msg-chat small { font-size: 11px; color: #888; margin-bottom: 4px; }
        .msg-chat p { margin: 0; font-size: 14px; color: var(--texto); line-height: 1.4; }

        .nota-sistema {
            align-self: center; background: #fef3c7; color: #92400e;
            font-size: 12px; padding: 4px 12px; border-radius: 20px;
        }

        .composer {
            display: flex; padding: 12px 16px; background: #fff;
            border-top: 1px solid var(--borda); gap: 10px;
        }

        .composer textarea {
            flex: 1; resize: none; border: 1px solid var(--borda);
            border-radius: 20px; padding: 10px 16px; font-family: inherit;
            font-size: 14px; outline: none; max-height: 100px; min-height: 40px;
        }

        .composer button {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--azul); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
        }

        .feedback { padding: 0 16px 10px; font-size: 12px; color: #dc2626; text-align: center; }

        .equipa-wrap, .convidar-wrap {
            flex: 1; padding: 30px; overflow-y: auto;
            display: flex; justify-content: center;
        }

        .card-config {
            background: #fff; border-radius: 12px; padding: 24px;
            width: 100%; max-width: 600px; box-shadow: var(--sombra); height: fit-content;
        }

        .card-config h2 { margin: 0 0 8px; font-size: 20px; color: var(--texto); }
        .card-config p { margin: 0 0 20px; color: #666; font-size: 14px; }

        .pessoa-equipa { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--borda); }
        .pessoa-equipa.inativa { opacity: 0.5; }
        .dados-equipa { flex: 1; }
        .dados-equipa strong { display: block; font-size: 15px; }
        .dados-equipa small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; margin-top: 2px; }

        .badge-funcao {
            font-size: 11px; font-weight: 700; padding: 3px 8px;
            border-radius: 12px; background: #e0f2fe; color: #0369a1;
        }
        .badge-funcao.admin { background: #fef3c7; color: #92400e; }

        .rodape-equipa { text-align: center; font-size: 12px; color: #888; margin-top: 20px; }
        .campo-grupo { margin-bottom: 16px; }
        .campo-grupo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--texto); }

        .campo-grupo input, .campo-grupo select {
            width: 100%; padding: 10px; border: 1px solid var(--borda);
            border-radius: 8px; font-family: inherit; font-size: 14px; box-sizing: border-box;
        }

        .caixa-link { margin-top: 20px; background: var(--cinza); padding: 16px; border-radius: 8px; }
        .titulo-link { font-weight: 600; font-size: 13px; margin: 0 0 10px; }
        .linha-link { display: flex; gap: 8px; margin-bottom: 10px; }

        .linha-link input {
            flex: 1; padding: 8px; border: 1px solid var(--borda);
            border-radius: 6px; font-size: 13px;
        }

        .nota-link { font-size: 12px; color: #666; margin: 0 0 12px; }
        .acoes-convite { display: flex; gap: 10px; }
        .vazio-suporte { padding: 30px; text-align: center; color: #888; font-size: 14px; }
        .oculto { display: none !important; }

        @media (max-width: 820px) {
            .topo { padding: 10px 12px; }
            .funcao-longa { display: none !important; }
            .funcao-curta { display: inline !important; }
            .abas-suporte { padding: 0 12px; gap: 12px; }
            .aba-suporte { font-size: 13px; }
            .layout-conv { display: block; height: 100%; }
            .painel-pedidos { width: 100%; height: 100%; display: flex; }

            .painel-conversa {
                display: none; width: 100%; height: 100%;
                position: absolute; top: 0; left: 0; z-index: 100;
            }

            body.chat-aberto .painel-pedidos { display: none; }
            body.chat-aberto .painel-conversa { display: flex; }
            body.chat-aberto .abas-suporte { display: none; }

            .equipa-wrap, .convidar-wrap { padding: 16px; }
            .card-config { padding: 16px; }
            .msg-chat { max-width: 85%; }
        }
    </style>
</head>
<body>

    <header class="topo">
        <div class="topo-logo" id="topoLogoVoltar">
            <img src="./assets/imagem logo.png" alt="Smart Luny">
            Suporte
        </div>
        <div class="topo-info" id="quemSou"></div>
    </header>

    <nav class="abas-suporte">
        <button id="abaConversas" class="aba-suporte ativa" type="button">
            <i class="fa-regular fa-comments"></i> Conversas
        </button>
        <button id="abaEquipa" class="aba-suporte" type="button">
            <i class="fa-solid fa-users"></i> Equipa
        </button>
        <button id="abaConvidar" class="aba-suporte oculto" type="button">
            <i class="fa-solid fa-user-plus"></i> Convidar
        </button>
    </nav>

    <div class="conteudo-suporte">
        
        <section id="vista-conversas" class="vista-suporte">
            <div class="layout-conv">
                <aside class="painel-pedidos">
                    <div class="filtros-conversas">
                        <button id="filtroAtivas" class="filtro-btn ativo">Ativas</button>
                        <button id="filtroArquivadas" class="filtro-btn">Arquivadas</button>
                    </div>
                    <button id="btnEsvaziarArquivo" class="btn-esvaziar oculto"><i class="fa-solid fa-trash"></i> Esvaziar</button>
                    <input id="pesquisa" class="pesquisa-suporte" type="search" placeholder="Pesquisar...">
                    <div id="listaItens" class="lista-itens"></div>
                </aside>

                <section class="painel-conversa">
                    <header class="cabecalho-conversa">
                        <div id="avatarConversa" class="avatar av-0 oculto"></div>
                        
                        <div class="info-conversa">
                            <strong id="tituloConversa">Selecione uma conversa</strong>
                            <div id="subConversa" class="sub-conversa">—</div>
                            <span id="identidadeCliente" class="identidade-cliente"></span>
                        </div>

                        <div class="acoes-conversa">
                            <button id="btnAssumir" class="btn-suporte oculto">Assumir</button>
                            <button id="btnConcluir" class="btn-suporte btn-secundario oculto">Concluir</button>
                            <button id="btnArquivar" class="btn-suporte btn-secundario oculto"><span id="txtArquivar">Arquivar</span></button>
                            <button id="btnApagar" class="btn-suporte btn-perigo oculto"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </header>

                    <div id="msgs" class="msgs">
                        <div class="vazio-suporte">Nenhuma conversa selecionada.</div>
                    </div>

                    <form id="composer" class="composer">
                        <textarea id="campo" placeholder="Escreva a mensagem..." disabled></textarea>
                        <button id="enviar" type="submit" disabled><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                    <div id="feedback" class="feedback"></div>
                </section>
            </div>
        </section>

        <section id="vista-equipa" class="vista-suporte oculta">
            <div class="equipa-wrap">
                <div class="card-config">
                    <h2>Equipa de Suporte</h2>
                    <p>Administradores e agentes ativos.</p>
                    <div id="listaEquipa"></div>
                    <div id="rodapeEquipa" class="rodape-equipa"></div>
                </div>
            </div>
        </section>

        <section id="vista-convidar" class="vista-suporte oculta">
            <div class="convidar-wrap">
                <div class="card-config">
                    <h2>Convidar Agente</h2>
                    <p>Gere um link e envie ao trabalhador.</p>
                    
                    <div class="campo-grupo">
                        <label>Email</label>
                        <input id="conviteEmail" type="email" placeholder="Ex: joao@email.com">
                    </div>
                    
                    <div class="campo-grupo">
                        <label>Nome (opcional)</label>
                        <input id="conviteNome" type="text" placeholder="Ex: João Silva">
                    </div>

                    <div class="campo-grupo">
                        <label>Função</label>
                        <select id="conviteFuncao">
                            <option value="agente">Agente</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>

                    <button id="btnGerarConvite" class="btn-suporte" style="width: 100%;"><i class="fa-solid fa-link"></i> Gerar link</button>
                    
                    <div id="resultadoConvite"></div>
                </div>
            </div>
        </section>

    </div>

    <script type="module" src="./js/suporte.js"></script>
</body>
</html>
